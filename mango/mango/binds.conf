##################
#### BINDINGS ####
##################

# https://mangowm.github.io/docs/bindings

# System
keymode = common
bind = SUPER,r,reload_config,
bindl = SUPER,m,quit,
bind = SUPER,Tab,toggleoverview,
# bind = SUPER,Tab,togglejump,
bind = SUPER,l,spawn,hyprlock

# Programs
keymode = default
bind = SUPER,Space,spawn_shell,pkill rofi || rofi -show drun
bind = SUPER,v,spawn_shell,cliphist list | rofi -dmenu -p 󱘟 -display-columns 2 | cliphist decode | wl-copy
bind = SUPER,Return,spawn,kitty
bind = SUPER,e,spawn,nemo
bind = SUPER,b,spawn,firefox-developer-edition
bind = SUPER+SHIFT,b,spawn,firefox-developer-edition --private-window
bind = CTRL+SHIFT,Escape,spawn,missioncenter
bind = SUPER,Slash,spawn,swaync-client -t -sw
bind = CTRL+ALT,Delete,spawn,~/.config/rofi/powermenu.sh
bind = NONE,Print,spawn_shell,grim -c -o "$(mmsg get all-monitors | jq -r '.monitors[] | select(.active) | .name')" - | tee $(xdg-user-dir PICTURES)/Screenshots/$(date +%Y%m%d_%H%M%S_grim.png) | wl-copy
bind = SHIFT,Print,spawn_shell,grim -g "$(slurp)" - | tee $(xdg-user-dir PICTURES)/Screenshots/$(date +%Y%m%d_%H%M%S_grim.png) | wl-copy
bind = ALT,Print,spawn_shell,grim -T $(mmsg get focusing-client | jq -r '.foreign_toplevel_id') - | tee $(xdg-user-dir PICTURES)/Screenshots/$(date +%Y%m%d_%H%M%S_grim.png) | wl-copy

# Media
bindl = NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume +1
bindl = NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume -1
bindl = NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bindl = NONE,XF86AudioMicMute,spawn,swayosd-client --input-volume mute-toggle
bindl = NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bindl = NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower
bindl = NONE,XF86AudioNext,spawn,swayosd-client --playerctl next
bindl = NONE,XF86AudioPrev,spawn,swayosd-client --playerctl previous
bindl = NONE,XF86AudioPlay,spawn,swayosd-client --playerctl play-pause
bindl = NONE,XF86AudioPause,spawn,swayosd-client --playerctl play-pause
bind = NONE,XF86Explorer,spawn,nemo
bind = NONE,XF86HomePage,spawn,nemo
# bind = NONE,XF86Mail,spawn,flatpak run com.tutanota.Tutanota --password-store=basic
bind = NONE,XF86Mail,spawn,firefox-developer-edition --new-tab https://app.tuta.com/mail
bind = NONE,XF86Calculator,spawn,qalculate-gtk

# Window
bind = SUPER,c,killclient,
bind = SUPER,q,killclient,force
bind = ALT,F4,killclient,force
bind = SUPER,p,toggleglobal,
bind = SUPER,g,togglefloating,
bind = SUPER+SHIFT,f,togglemaximizescreen,
bind = SUPER,f,togglefullscreen,
bind = SUPER+ALT,f,togglefakefullscreen,
bind = SUPER,o,toggleoverlay,
bind = SUPER,k,setkeymode,floating
bind = SUPER,t,setoption,allow_tearing,2
bind = SUPER+SHIFT,t,setoption,allow_tearing,0

# Navigation
bind = ALT,Tab,focusstack,next
bind = ALT+SHIFT,Tab,focusstack,prev
bind = SUPER,Left,focusdir,left
bind = SUPER,Right,focusdir,right
bind = SUPER,Up,focusdir,up
bind = SUPER,Down,focusdir,down
bind = SUPER+SHIFT,Left,exchange_client,left
bind = SUPER+SHIFT,Right,exchange_client,right
bind = SUPER+SHIFT,Up,exchange_client,up
bind = SUPER+SHIFT,Down,exchange_client,down

# Scratchpad
# bind = SUPER+SHIFT,s,minimized,
# bind = SUPER+ALT+SHIFT,s,restore_minimized,
# bind = SUPER,s,toggle_scratchpad

# Layout
# bind = SUPER,n,switch_layout,
# bind = SUPER,j,dwindle_toggle_current_split,

# View
bind = SUPER,Prior,viewtoleft_have_client,0
bind = SUPER,Next,viewtoright_have_client,0
bind = SUPER,1,view,1,0
bind = SUPER,2,view,2,0
bind = SUPER,3,view,3,0
bind = SUPER,4,view,4,0
bind = SUPER,5,view,5,0
bind = SUPER,6,view,6,0
bind = SUPER,7,view,7,0
bind = SUPER,8,view,8,0
bind = SUPER,9,view,9,0
bind = SUPER+CTRL,Left,focusmon,left
bind = SUPER+CTRL,Right,focusmon,right

# Tag
bind = SUPER+SHIFT,Prior,tagtoleft,0
bind = SUPER+SHIFT,Next,tagtoright,0
bind = SUPER+SHIFT,1,tag,1,0
bind = SUPER+SHIFT,2,tag,2,0
bind = SUPER+SHIFT,3,tag,3,0
bind = SUPER+SHIFT,4,tag,4,0
bind = SUPER+SHIFT,5,tag,5,0
bind = SUPER+SHIFT,6,tag,6,0
bind = SUPER+SHIFT,7,tag,7,0
bind = SUPER+SHIFT,8,tag,8,0
bind = SUPER+SHIFT,9,tag,9,0
bind = SUPER+ALT+SHIFT,1,tagsilent,1,0
bind = SUPER+ALT+SHIFT,2,tagsilent,2,0
bind = SUPER+ALT+SHIFT,3,tagsilent,3,0
bind = SUPER+ALT+SHIFT,4,tagsilent,4,0
bind = SUPER+ALT+SHIFT,5,tagsilent,5,0
bind = SUPER+ALT+SHIFT,6,tagsilent,6,0
bind = SUPER+ALT+SHIFT,7,tagsilent,7,0
bind = SUPER+ALT+SHIFT,8,tagsilent,8,0
bind = SUPER+ALT+SHIFT,9,tagsilent,9,0
bind = SUPER+CTRL+SHIFT,Left,tagmon,left
bind = SUPER+CTRL+SHIFT,Right,tagmon,right

# Floating
keymode = floating
bind = SUPER,k,setkeymode,default
bind = NONE,Left,smartmovewin,left
bind = NONE,Right,smartmovewin,right
bind = NONE,Up,smartmovewin,up
bind = NONE,Down,smartmovewin,down
bind = ALT,Left,smartresizewin,left
bind = ALT,Right,smartresizewin,right
bind = ALT,Up,smartresizewin,up
bind = ALT,Down,smartresizewin,down
keymode = default

# Mouse
mousebind = SUPER,Btn_left,moveresize,curmove
mousebind = SUPER,Btn_right,moveresize,curresize
# mousebind = NONE,Btn_middle,togglemaximizescreen,0

# Axis
axisbind = SUPER,UP,viewtoleft_have_client,
axisbind = SUPER,DOWN,viewtoright_have_client,

# Gesture
gesturebind = NONE,left,3,viewtoleft_have_client,0
gesturebind = NONE,right,3,viewtoright_have_client,0
# gesturebind = NONE,up,3,
# gesturebind = NONE,down,3,
