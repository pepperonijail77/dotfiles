#######################
#### INPUT DEVICES ####
#######################

# https://mangowm.github.io/docs/configuration/input

# Keyboard
repeat_rate = 25
repeat_delay = 600

numlockon = 0

xkb_rules_layout = us
xkb_rules_options = compose:ralt

# Mouse
mouse_natural_scrolling = 0

mouse_accel_profile = 0

# Trackpad
disable_trackpad = 0

trackpad_natural_scrolling = 0

trackpad_accel_profile = 2

tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
button_map = 0
swipe_min_threshold = 1

scroll_method = 1
click_method = 2
disable_while_typing = 1
left_handed = 0
middle_button_emulation = 0

