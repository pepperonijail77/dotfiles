# https://mangowm.github.io/docs/window-management/rules

# Tag rules
tag_rule = id:0,layout_name:scroller,no_hide:1
tag_rule = id:1,layout_name:fair,no_hide:1
tag_rule = id:2,layout_name:tile,no_hide:1
tag_rule = id:3,layout_name:tile,no_hide:1
tag_rule = id:4,layout_name:dwindle,no_hide:1
tag_rule = id:5,layout_name:dwindle
tag_rule = id:6,layout_name:dwindle
tag_rule = id:7,layout_name:dwindle
tag_rule = id:8,layout_name:dwindle
tag_rule = id:9,layout_name:dwindle

# Window rules
window_rule = is_floating:1,is_overlay:1,focused_opacity:0.8,height:0,app_id:qalculate.*
window_rule = is_floating:1,is_overlay:1,app_id:missioncenter
window_rule = idle_inhibit_when_focus:1,app_id:steam_app_.*
window_rule = is_floating:1,width:460,height:800,app_id:steam,title:Friends List

window_rule = tags:0,app_id:signal
window_rule = tags:0,app_id:vesktop
window_rule = tags:0,title:WhatsApp Web
window_rule = tags:0,title:Snapchat

# layer rules
layer_rule = animation_type_open:slide,animation_type_close:slide,layer_name:swaync-control-center
layer_rule = animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi
layer_rule = animation_type_open:slide,animation_type_close:slide,layer_name:swayosd
layer_rule = no_blur:1,animation_type_close:none,layer_name:selection
