###################
#### AUTOSTART ####
###################

# https://mangowm.github.io/docs/configuration/basics#autostart

exec_once = swaybg -i ~/.wallpapers/nord.jpg
exec_once = waybar
exec_once = wl-clip-persist --clipboard regular --reconnect-tries 0
exec_once = swaync
exec_once = swayosd-server
exec_once = pkexec swayosd-libinput-backend
exec_once = swayidle -C $XDG_CONFIG_HOME/swayidle/mango
exec_once = lxpolkit
exec_once = wl-paste --watch cliphist store
exec_once = nm-applet
exec_once = steam -silent
